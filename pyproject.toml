[project]
name = "copilote-round3-b"
version = "1.0.0"
description = "Standalone reproduction of the round-three B session-identification blend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.5.2",
  "numpy==2.2.6",
  "optuna==4.5.0",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
notebooks = ["ipykernel==6.30.1", "nbclient==0.10.2", "nbformat==5.10.4", "jupyterlab==4.4.9"]
dev = ["pytest==8.4.2", "black==25.9.0", "ruff==0.14.0", "mypy==1.18.2"]

[project.scripts]
copilote-b = "copilote_b.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "copilote_b"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*", "sklearn.*", "joblib.*", "threadpoolctl.*"]
ignore_missing_imports = true
