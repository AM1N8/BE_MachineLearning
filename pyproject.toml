[project]
name = "be-ml"
version = "0.1.0"
description = "Reproducible Copilote session user identification"
readme = "README.md"
authors = [
    { email = "mohamedaminedarraj@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "numpy==2.4.4",
    "pyyaml==6.0.3",
    "joblib==1.5.3",
    "tqdm==4.67.3",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.15.7",
    "nbformat==5.10.4",
    "nbclient==0.10.4",
    "ipykernel==7.2.0",
    "jinja2==3.1.6",
    "optuna==4.5.0",
]

[project.scripts]
be-ml = "be_ml:main"
copilote = "copilote.run_all:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["be_ml", "copilote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
